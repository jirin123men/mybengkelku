<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sparepart - MyBengkelKu</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
display:flex;
background:#f1f5f9;
}

.sidebar{
width:260px;
height:100vh;
background:#0f172a;
position:fixed;
left:0;
top:0;
overflow-y:auto;
}

.logo{
padding:25px;
text-align:center;
font-size:24px;
font-weight:bold;
color:white;
border-bottom:1px solid rgba(255,255,255,.1);
}

.menu{
padding:15px;
}

.menu a{
display:block;
padding:14px;
margin-bottom:8px;
color:white;
text-decoration:none;
border-radius:10px;
transition:.3s;
}

.menu a:hover,
.menu a.active{
background:#2563eb;
}

.main{
margin-left:260px;
width:100%;
}

.topbar{
background:white;
padding:20px 30px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.content{
padding:25px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 3px 15px rgba(0,0,0,.08);
margin-bottom:20px;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
}

.btn{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
}

.btn:hover{
background:#1d4ed8;
}

table{
width:100%;
border-collapse:collapse;
}

table th{
background:#2563eb;
color:white;
padding:12px;
}

table td{
padding:12px;
border-bottom:1px solid #ddd;
}

.stok-aman{
background:#22c55e;
color:white;
padding:5px 10px;
border-radius:20px;
font-size:12px;
}

.stok-rendah{
background:#ef4444;
color:white;
padding:5px 10px;
border-radius:20px;
font-size:12px;
}

.btn-delete{
background:#ef4444;
color:white;
border:none;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

</style>

</head>
<body>

<div class="sidebar">

<div class="logo">
🚗 MyBengkelKu
</div>

<div class="menu">

<a href="dashboard.html">
<i class="fas fa-home"></i>
 Dashboard
</a>

<a href="pelanggan.html">
<i class="fas fa-users"></i>
 Pelanggan
</a>

<a href="kendaraan.html">
<i class="fas fa-car"></i>
 Kendaraan
</a>

<a href="servis.html">
<i class="fas fa-tools"></i>
 Servis
</a>

<a href="sparepart.html" class="active">
<i class="fas fa-boxes"></i>
 Sparepart
</a>

<a href="transaksi.html">
<i class="fas fa-cash-register"></i>
 Transaksi
</a>

<a href="laporan.html">
<i class="fas fa-chart-line"></i>
 Laporan
</a>

<a href="langganan.html">
<i class="fas fa-crown"></i>
 Langganan
</a>

</div>

</div>

<div class="main">

<div class="topbar">

<h2>📦 Data Sparepart</h2>

<div>
👤 Admin Bengkel
</div>

</div>

<div class="content">

<div class="card">

<h3>Tambah Sparepart</h3>

<br>

<div class="form-grid">

<input type="text"
id="namaPart"
placeholder="Nama Sparepart">

<input type="number"
id="stok"
placeholder="Jumlah Stok">

<input type="number"
id="harga"
placeholder="Harga">

</div>

<br>

<button class="btn" onclick="tambahSparepart()">
<i class="fas fa-plus"></i>
 Tambah Sparepart
</button>

</div>

<div class="card">

<h3>Daftar Sparepart</h3>

<br>

<table>

<thead>
<tr>
<th>No</th>
<th>Nama Sparepart</th>
<th>Stok</th>
<th>Harga</th>
<th>Status</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="dataSparepart">

</tbody>

</table>

</div>

</div>

</div>

<script>

let sparepart=[];

function tambahSparepart(){

const nama=
document.getElementById("namaPart").value;

const stok=
document.getElementById("stok").value;

const harga=
document.getElementById("harga").value;

if(nama===""){
alert("Nama sparepart wajib diisi");
return;
}

sparepart.push({
nama,
stok,
harga
});

renderSparepart();

document.getElementById("namaPart").value="";
document.getElementById("stok").value="";
document.getElementById("harga").value="";

}

function renderSparepart(){

let html="";

sparepart.forEach((item,index)=>{

html += `
<tr>

<td>${index+1}</td>

<td>${item.nama}</td>

<td>${item.stok}</td>

<td>Rp ${Number(item.harga).toLocaleString('id-ID')}</td>

<td>
<span class="${
item.stok <= 5
? 'stok-rendah'
: 'stok-aman'
}">
${item.stok <= 5 ? 'Stok Rendah' : 'Aman'}
</span>
</td>

<td>

<button
class="btn-delete"
onclick="hapusSparepart(${index})">

<i class="fas fa-trash"></i>

</button>

</td>

</tr>
`;

});

document.getElementById("dataSparepart").innerHTML=html;

}

function hapusSparepart(index){

if(confirm("Hapus sparepart ini?")){

sparepart.splice(index,1);

renderSparepart();

}

}

</script>

</body>
</html>
