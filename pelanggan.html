<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pelanggan - MyBengkelKu</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
body{font-family:Segoe UI,sans-serif;background:#f1f5f9;margin:0}
.main{padding:20px}
.report-box{background:#fff;padding:20px;border-radius:10px;margin-bottom:20px}
input,textarea{width:100%;padding:10px;margin-top:10px;border:1px solid #ddd;border-radius:8px}
.btn{background:#2563eb;color:#fff;padding:10px 15px;border:none;border-radius:8px;cursor:pointer;margin-top:10px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:10px;border-bottom:1px solid #ddd}
th{background:#2563eb;color:#fff}
</style>

</head>
<body>

<div class="main">

<h2>👥 Data Pelanggan</h2>

<!-- FORM -->
<div class="report-box">

<h3>Tambah Pelanggan</h3>

<input type="text" id="nama" placeholder="Nama">
<input type="text" id="telepon" placeholder="WhatsApp">
<input type="email" id="email" placeholder="Email">
<input type="text" id="kendaraan" placeholder="Kendaraan">
<textarea id="alamat" placeholder="Alamat"></textarea>

<button class="btn" onclick="tambahPelanggan()">
Simpan
</button>

</div>

<!-- TABLE -->
<div class="report-box">

<h3>Data Pelanggan</h3>

<table>
<thead>
<tr>
<th>No</th>
<th>Nama</th>
<th>WhatsApp</th>
<th>Email</th>
<th>Kendaraan</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="tbodyPelanggan"></tbody>

</table>

</div>

</div>

<script type="module">
import { db } from "./firebase.js";

import {
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

async function tambahPelanggan() {

  const nama = document.getElementById("nama").value;
  const telepon = document.getElementById("telepon").value;
  const email = document.getElementById("email").value;
  const kendaraan = document.getElementById("kendaraan").value;
  const alamat = document.getElementById("alamat").value;

  if (!nama) {
    alert("Nama wajib diisi");
    return;
  }

  await addDoc(collection(db, "pelanggan"), {
    nama,
    telepon,
    email,
    kendaraan,
    alamat,
    createdAt: new Date()
  });

  alert("Berhasil disimpan ke Firebase");

  clearForm();
  loadPelanggan();
}

function clearForm() {
  nama.value = "";
  telepon.value = "";
  email.value = "";
  kendaraan.value = "";
  alamat.value = "";
}

async function loadPelanggan() {

  const snap = await getDocs(collection(db, "pelanggan"));

  const tbody = document.getElementById("tbodyPelanggan");
  tbody.innerHTML = "";

  let no = 1;

  snap.forEach((d) => {

    let data = d.data();

    tbody.innerHTML += `
      <tr>
        <td>${no++}</td>
        <td>${data.nama}</td>
        <td>${data.telepon}</td>
        <td>${data.email}</td>
        <td>${data.kendaraan}</td>
        <td>
          <button onclick="hapusPelanggan('${d.id}')">
            Hapus
          </button>
        </td>
      </tr>
    `;
  });

}

async function hapusPelanggan(id) {

  await deleteDoc(doc(db, "pelanggan", id));

  loadPelanggan();
}

window.tambahPelanggan = tambahPelanggan;
window.hapusPelanggan = hapusPelanggan;

loadPelanggan();

</script>

</body>
</html>
