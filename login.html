<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - MyBengkelKu</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#2563eb);
}

.login-box{
background:#fff;
width:400px;
padding:40px;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,.2);
}

.logo{
text-align:center;
font-size:32px;
font-weight:bold;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:30px;
}

.input-group{
margin-bottom:20px;
}

.input-group label{
display:block;
margin-bottom:5px;
font-weight:600;
}

.input-group input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
}

.btn{
width:100%;
padding:14px;
border:none;
background:#2563eb;
color:#fff;
font-size:16px;
font-weight:bold;
border-radius:10px;
cursor:pointer;
}

.btn:hover{
background:#1d4ed8;
}

.register{
text-align:center;
margin-top:20px;
}

.register a{
text-decoration:none;
color:#2563eb;
}

</style>

</head>
<body>

<div class="login-box">

<div class="logo">
🚗 MyBengkelKu
</div>

<div class="subtitle">
Masuk ke Dashboard Bengkel Anda
</div>

<form>

<div class="input-group">
<label>Email</label>
<input type="email" id="email" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password" required>
</div>

<button
type="button"
onclick="loginUser()">
Login
</button>

<script type="module" src="js/auth.js"></script>

</form>

<div class="register">
Belum punya akun?
<a href="register.html">Daftar Sekarang</a>
</div>

</div>

</body>
</html>
