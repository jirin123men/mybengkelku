<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Servis Kendaraan - MyBengkelKu</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f1f5f9;
display:flex;
}

.sidebar{
width:260px;
height:100vh;
background:#0f172a;
position:fixed;
left:0;
top:0;
}

.logo{
padding:25px;
text-align:center;
font-size:24px;
font-weight:bold;
color:white;
border-bottom:1px solid rgba(255,255,255,.1);
}

.menu{
padding:15px;
}

.menu a{
display:block;
padding:14px;
margin-bottom:8px;
text-decoration:none;
color:white;
border-radius:10px;
}

.menu a:hover,
.menu a.active{
background:#2563eb;
}

.main{
margin-left:260px;
width:100%;
}

.topbar{
background:white;
padding:20px 30px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
display:flex;
justify-content:space-between;
}

.content{
padding:25px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 3px 15px rgba(0,0,0,.08);
margin-bottom:20px;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

input,
select,
textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
}

textarea{
height:100px;
resize:none;
}

.btn{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
}

.btn:hover{
background:#1d4ed8;
}

table{
width:100%;
border-collapse:collapse;
}

table th{
background:#2563eb;
color:white;
padding:12px;
}

table td{
padding:12px;
border-bottom:1px solid #ddd;
}

.status{
padding:5px 10px;
border-radius:20px;
color:white;
font-size:12px;
}

.proses{
background:#f59e0b;
}

.selesai{
background:#22c55e;
}

.menunggu{
background:#ef4444;
}

</style>

</head>
<body>

<div class="sidebar">

<div class="logo">
🚗 MyBengkelKu
</div>

<div class="menu">

<a href="dashboard.html">
<i class="fas fa-home"></i>
 Dashboard
</a>

<a href="pelanggan.html">
<i class="fas fa-users"></i>
 Pelanggan
</a>

<a href="kendaraan.html">
<i class="fas fa-car"></i>
 Kendaraan
</a>

<a href="servis.html" class="active">
<i class="fas fa-tools"></i>
 Servis
</a>

<a href="sparepart.html">
<i class="fas fa-boxes"></i>
 Sparepart
</a>

<a href="transaksi.html">
<i class="fas fa-cash-register"></i>
 Transaksi
</a>

<a href="laporan.html">
<i class="fas fa-chart-line"></i>
 Laporan
</a>

<a href="langganan.html">
<i class="fas fa-crown"></i>
 Langganan
</a>

</div>

</div>

<div class="main">

<div class="topbar">
<h2>🔧 Data Servis</h2>
<div>👤 Admin</div>
</div>

<div class="content">

<div class="card">

<h3>Tambah Servis</h3>

<br>

<div class="form-grid">

<input type="text" id="pelanggan" placeholder="Nama Pelanggan">

<input type="text" id="kendaraan" placeholder="Kendaraan">

<input type="text" id="nopol" placeholder="Nomor Polisi">

<select id="jenisServis">
<option>Ganti Oli</option>
<option>Tune Up</option>
<option>Servis Mesin</option>
<option>Servis Rem</option>
<option>Servis Kelistrikan</option>
</select>

</div>

<br>

<textarea
id="keluhan"
placeholder="Keluhan Kendaraan">
</textarea>

<br><br>

<button class="btn" onclick="tambahServis()">
<i class="fas fa-plus"></i>
 Tambah Servis
</button>

</div>

<div class="card">

<h3>Daftar Servis</h3>

<br>

<table>

<thead>

<tr>
<th>No</th>
<th>Pelanggan</th>
<th>Kendaraan</th>
<th>No Polisi</th>
<th>Servis</th>
<th>Status</th>
</tr>

</thead>

<tbody id="tabelServis">

</tbody>

</table>

</div>

</div>

</div>

<script>

let dataServis=[];

function tambahServis(){

const pelanggan=
document.getElementById("pelanggan").value;

const kendaraan=
document.getElementById("kendaraan").value;

const nopol=
document.getElementById("nopol").value;

const servis=
document.getElementById("jenisServis").value;

if(pelanggan===""){
alert("Nama pelanggan wajib diisi");
return;
}

dataServis.push({
pelanggan,
kendaraan,
nopol,
servis,
status:"Menunggu"
});

renderTable();

document.getElementById("pelanggan").value="";
document.getElementById("kendaraan").value="";
document.getElementById("nopol").value="";
}

function renderTable(){

let html="";

dataServis.forEach((item,index)=>{

html+=`
<tr>
<td>${index+1}</td>
<td>${item.pelanggan}</td>
<td>${item.kendaraan}</td>
<td>${item.nopol}</td>
<td>${item.servis}</td>
<td>
<span class="status menunggu">
${item.status}
</span>
</td>
</tr>
`;

});

document.getElementById("tabelServis").innerHTML=html;

}

</script>

</body>
</html>
