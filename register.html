<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daftar - MyBengkelKu</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#2563eb);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.card{
width:420px;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
}

.logo{
text-align:center;
font-size:32px;
font-weight:bold;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:30px;
}

.form-group{
margin-bottom:15px;
}

label{
display:block;
margin-bottom:5px;
font-weight:600;
}

input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.info{
margin-top:20px;
padding:12px;
background:#f0fdf4;
border-radius:10px;
font-size:14px;
color:#166534;
}

.login-link{
text-align:center;
margin-top:20px;
}

.login-link a{
text-decoration:none;
color:#2563eb;
}

</style>
</head>
<body>

<div class="card">

<div class="logo">
🚗 MyBengkelKu
</div>

<div class="subtitle">
Daftar Trial Gratis 2 Hari
</div>

<form id="registerForm">

<div class="form-group">
<label>Nama Bengkel</label>
<input type="text" id="namaBengkel" required>
</div>

<div class="form-group">
<label>Nama Pemilik</label>
<input type="text" id="namaPemilik" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" id="email" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="password" required>
</div>

<div class="form-group">
<label>Konfirmasi Password</label>
<input type="password" id="confirmPassword" required>
</div>

<button type="submit">
<i class="fas fa-user-plus"></i>
 Daftar Sekarang
</button>

</form>

<div class="info">
✅ Trial Gratis 2 Hari<br>
✅ Semua Fitur Aktif<br>
✅ Tanpa Kartu Kredit
</div>

<div class="login-link">
Sudah punya akun?
<a href="login.html">Login</a>
</div>

</div>

<script type="module">

// nanti dihubungkan ke Firebase

document.getElementById('registerForm')
.addEventListener('submit', function(e){

e.preventDefault();

const pass =
document.getElementById('password').value;

const confirm =
document.getElementById('confirmPassword').value;

if(pass !== confirm){
alert("Password tidak sama");
return;
}

alert("Siap dihubungkan ke Firebase");

});

</script>

</body>
</html>
