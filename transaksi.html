<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transaksi - MyBengkelKu</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
display:flex;
background:#f1f5f9;
}

.sidebar{
width:260px;
height:100vh;
background:#0f172a;
position:fixed;
left:0;
top:0;
overflow-y:auto;
}

.logo{
padding:25px;
text-align:center;
font-size:24px;
font-weight:bold;
color:white;
border-bottom:1px solid rgba(255,255,255,.1);
}

.menu{
padding:15px;
}

.menu a{
display:block;
padding:14px;
margin-bottom:8px;
text-decoration:none;
color:white;
border-radius:10px;
transition:.3s;
}

.menu a:hover,
.menu a.active{
background:#2563eb;
}

.main{
margin-left:260px;
width:100%;
}

.topbar{
background:white;
padding:20px 30px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.content{
padding:25px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 3px 15px rgba(0,0,0,.08);
margin-bottom:20px;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
}

.btn{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
}

.btn:hover{
background:#1d4ed8;
}

.total-box{
background:#16a34a;
color:white;
padding:20px;
border-radius:15px;
font-size:26px;
font-weight:bold;
text-align:center;
margin-top:15px;
}

table{
width:100%;
border-collapse:collapse;
}

table th{
background:#2563eb;
color:white;
padding:12px;
}

table td{
padding:12px;
border-bottom:1px solid #ddd;
}

.btn-delete{
background:#dc2626;
color:white;
border:none;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

</style>

</head>
<body>

<div class="sidebar">

<div class="logo">
🚗 MyBengkelKu
</div>

<div class="menu">

<a href="dashboard.html">
<i class="fas fa-home"></i> Dashboard
</a>

<a href="pelanggan.html">
<i class="fas fa-users"></i> Pelanggan
</a>

<a href="kendaraan.html">
<i class="fas fa-car"></i> Kendaraan
</a>

<a href="servis.html">
<i class="fas fa-tools"></i> Servis
</a>

<a href="sparepart.html">
<i class="fas fa-boxes"></i> Sparepart
</a>

<a href="transaksi.html" class="active">
<i class="fas fa-cash-register"></i> Transaksi
</a>

<a href="laporan.html">
<i class="fas fa-chart-line"></i> Laporan
</a>

<a href="langganan.html">
<i class="fas fa-crown"></i> Langganan
</a>

</div>

</div>

<div class="main">

<div class="topbar">

<h2>💰 Transaksi Bengkel</h2>

<div>
👤 Admin Bengkel
</div>

</div>

<div class="content">

<div class="card">

<h3>Tambah Transaksi</h3>

<br>

<div class="form-grid">

<input type="text" id="pelanggan" placeholder="Nama Pelanggan">

<input type="text" id="servis" placeholder="Jenis Servis">

<input type="number" id="biayaServis" placeholder="Biaya Servis">

<input type="number" id="biayaSparepart" placeholder="Biaya Sparepart">

</div>

<br>

<button class="btn" onclick="tambahTransaksi()">
<i class="fas fa-plus"></i>
 Tambah Transaksi
</button>

</div>

<div class="card">

<h3>Daftar Transaksi</h3>

<br>

<table>

<thead>
<tr>
<th>No</th>
<th>Pelanggan</th>
<th>Servis</th>
<th>Biaya Servis</th>
<th>Sparepart</th>
<th>Total</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="dataTransaksi">

</tbody>

</table>

<div class="total-box">
Total Pendapatan :
<span id="grandTotal">Rp 0</span>
</div>

</div>

</div>

</div>

<script>

let transaksi=[];

function tambahTransaksi(){

const pelanggan =
document.getElementById("pelanggan").value;

const servis =
document.getElementById("servis").value;

const biayaServis =
Number(document.getElementById("biayaServis").value);

const biayaSparepart =
Number(document.getElementById("biayaSparepart").value);

if(pelanggan===""){
alert("Nama pelanggan wajib diisi");
return;
}

const total =
biayaServis + biayaSparepart;

transaksi.push({
pelanggan,
servis,
biayaServis,
biayaSparepart,
total
});

renderTransaksi();

document.getElementById("pelanggan").value="";
document.getElementById("servis").value="";
document.getElementById("biayaServis").value="";
document.getElementById("biayaSparepart").value="";

}

function renderTransaksi(){

let html="";
let grandTotal=0;

transaksi.forEach((item,index)=>{

grandTotal += item.total;

html += `
<tr>

<td>${index+1}</td>

<td>${item.pelanggan}</td>

<td>${item.servis}</td>

<td>Rp ${item.biayaServis.toLocaleString('id-ID')}</td>

<td>Rp ${item.biayaSparepart.toLocaleString('id-ID')}</td>

<td>Rp ${item.total.toLocaleString('id-ID')}</td>

<td>

<button
class="btn-delete"
onclick="hapusTransaksi(${index})">

<i class="fas fa-trash"></i>

</button>

</td>

</tr>
`;

});

document.getElementById("dataTransaksi").innerHTML = html;

document.getElementById("grandTotal").innerHTML =
"Rp " + grandTotal.toLocaleString('id-ID');

}

function hapusTransaksi(index){

if(confirm("Hapus transaksi ini?")){

transaksi.splice(index,1);

renderTransaksi();

}

}

</script>

</body>
</html>
